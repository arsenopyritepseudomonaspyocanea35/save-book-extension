name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and build only - do not create the tag or release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check the version is new and higher than every previous release
        id: version
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' public/manifest.json)
          echo "manifest version: $VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::public/manifest.json version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          if [[ -z "$PREVIOUS" ]]; then
            echo "no previous release found - accepting $VERSION as the first"
          else
            echo "highest existing release: $PREVIOUS"
            if [[ "$PREVIOUS" == "v$VERSION" ]]; then
              echo "::error::v$VERSION has already been released. Bump \"version\" in public/manifest.json."
              exit 1
            fi
            if [[ "$(printf '%s\n%s\n' "$PREVIOUS" "v$VERSION" | sort -V | tail -n1)" != "v$VERSION" ]]; then
              echo "::error::v$VERSION is not higher than $PREVIOUS. Bump \"version\" in public/manifest.json."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the extension and the store zip
        id: package
        run: |
          set -euo pipefail
          bun run package
          ZIP=$(ls -1 release/*.zip | head -n1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip to publish: $ZIP"

      - name: Create the tag and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
          echo "published $TAG"
